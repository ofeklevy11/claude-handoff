name: tests

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  offline-suite:
    name: run_tests (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.8", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Offline test suite (no Claude, no network)
        shell: bash
        run: python tests/run_tests.py
